# Model configuration: all settings that affect the built model

########################################################################
#                              IMPORTS                                 #
# All the files that define the model configuration should be imported #
########################################################################

import:

    - 'Model_config/Location_Constraints_BESS.yaml'
    - 'Model_config/Location_Constraints_PHES.yaml'

    - 'Model_config/Location_Constraints_Hydro.yaml'
    - 'Model_config/Location_Constraints_NG.yaml'
    
    - 'Model_config/Location_Constraints_MSR.yaml'
    - 'Model_config/Location_Constraints.yaml'
    
    - 'Model_config/Technologies_NG_BESS_PHES.yaml'
    - 'Model_config/Technologies_Hydro.yaml'
    
    - 'Model_config/Technologies_MSR.yaml'
    - 'Model_config/Technologies_PP.yaml'
    - 'Model_config/Technologies_Transmission_&_Demand.yaml'

    - 'Model_config/Transmission_links_Existing_and_Future_Simplified_2030.yaml'
    - 'Model_config/Transmission_links_Free.yaml'

########################################################################
#                                MODEL                                 #
#                      General settings of the model                   #
########################################################################

model:

    name: 'SAPP Transmission Expansion 2030 Models'
    calliope_version: 0.6.10
    timeseries_data_path: 'Timeseries'
    timeseries_dateformat: '%Y/%m/%d %H:%M:%S'
    subset_time: ['2030-01-01', '2030-12-31']

run:
    mode: plan  # Choices: plan, operate

    solver: gurobi
    solver_options:
        NumericFocus: 1
        BarHomogeneous: 1
    
    cyclic_storage: True
    symbolic_solver_labels: False

    ensure_feasibility: True  # Switches on the "unmet demand" constraint
    bigM: 1e6                  # Sets the scale of unmet demand, which cannot be too high,
                               # otherwise the optimisation will not converge
    zero_threshold: 1e-20      # Any value coming out of the backend that is smaller than this, will be set to zero
    objective_options: {'cost_class': {'monetary': 1, 'co2': 0}, 'sense': minimize}

    operation:     # Activate if in Operate mode only
        horizon: 48
        window: 24