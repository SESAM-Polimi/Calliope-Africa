#   STORAGE TECHNOLOGIES   #
############################
    
    BESS:           
        essentials:
            color: '#8000bf' 
            name: 'Battery Energy Storage System'
            parent: storage  
            carrier: electricity
            
        constraints:
            energy_efficiency:  0.96            # https://atb.nrel.gov/electricity/2022/utility-scale_battery_storage
            storage_loss: 0
            lifetime: 15                        # https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2017/Oct/IRENA_Electricity_Storage_Costs_2017
            storage_discharge_depth: 0.1        # https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2017/Oct/IRENA_Electricity_Storage_Costs_2017
            storage_initial: 0.2      

        costs:
            monetary:
                energy_cap: 1173.726             # https://atb.nrel.gov/electricity/2022/utility-scale_battery_storage Conservative data at 2030
                om_annual: 29.343                 # https://atb.nrel.gov/electricity/2022/utility-scale_battery_storage Conservative data at 2030
                interest_rate: 0.10