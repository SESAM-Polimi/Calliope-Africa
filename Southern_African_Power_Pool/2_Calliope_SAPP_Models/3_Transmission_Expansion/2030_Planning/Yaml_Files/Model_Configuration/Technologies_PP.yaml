
###  Technology Definition  ###
# Parameters and Units:
    # resource:      limitation over the power output 
    # resource_unit: Defines the unit of numbers provided in resource e.g: HourlyCapacityFactor=energy_per_cap
    # energy_eff:    efficiency of power plant             [-]
    # lifetime:      Life time of the power plant          [year]
    # energy_cap:    Capital investment of the technology  [$/kW]
    # om_annual:     Fixed annual O&M cost                 [$/kW]
    # om_prod:       Variable cost of production           [$/kWh]
    # om_con:        Variable cost of fuel                 [$/kWh]
    # interest_rate: Interest rate                         [-]

# Supply, Conversion, Demand, Storage and Transmission Technologies #
# NOTE: energy_cap = 0 because the list of technologies are already built and not new installations

techs:

################################
#   FOSSIL FUEL TECHNOLOGIES   #
################################
            
############################### Coal - Fossil Fuel 1 ###############################
    Coal_pp:
        
        essentials:
            color: '#000000' 
            name: 'Coal Power Plant'
            parent: supply                 
            carrier_out: electricity                     
                  
        constraints:
            energy_eff: 0.41                      # https://www.sciencedirect.com/topics/engineering/power-generation-efficiency 
            resource: inf                                                     
            lifetime: 40                          # https://iea-etsap.org/E-TechDS/PDF/E01-coal-fired-power-GS-AD-gct_FINAL.pdf                              
            energy_ramping: 0.15                  # https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2019/Sep/IRENA_Flexibility_in_CPPs_2019.pdf?la=en&hash=AF60106EA083E492638D8FA9ADF7FD099259F5A1
        
        costs:
            monetary:   
                energy_cap: 0
                # energy_cap: 2200                  # https://iea-etsap.org/E-TechDS/PDF/E01-coal-fired-power-GS-AD-gct_FINAL.pdf
                om_annual: 32.8                   # https://www.nrel.gov/docs/fy11osti/48595.pdf, Arithmetic mean of the indicated values                     
                om_prod: 0.0043                   # https://www.nrel.gov/docs/fy11osti/48595.pdf, Arithmetic mean of the indicated values   
                om_con: 0.0082                    # https://iea-etsap.org/E-TechDS/PDF/E01-coal-fired-power-GS-AD-gct_FINAL.pdf, Arithmetic mean of the indicated values
                interest_rate: 0.10   
            co2:
                om_prod: 0.760                    # https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf           
                # om_prod: 0.820                    # Life-cycle, https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf   

############################### CCGT - Fossil Fuel 2 ###############################
    CCGT_pp:
        essentials:
            color: '#ae00ff'
            name: 'Combined Cycle Gas Turbine Power Plant Existing Plants Aggregated'
            parent: supply                 
            carrier_out: electricity                     
                  
        constraints:
            energy_eff: 0.56                      # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf, Geometric mean of the indicated values                                        
            resource: inf                                                    
            lifetime: 30                          # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf                                                                      
            energy_ramping: 0.4                   # https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2019/Sep/IRENA_Flexibility_in_CPPs_2019.pdf?la=en&hash=AF60106EA083E492638D8FA9ADF7FD099259F5A1            

        costs:
            monetary:   
                energy_cap: 0      # $/kW
                # energy_cap: 1100  # $/kW         # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf, Typical value                                                                     
                om_annual: 13.9    # $/kW/y       # https://www.nrel.gov/docs/fy11osti/48595.pdf, Arithmetic mean of the indicated values  
                om_prod: 0.0025    # $/kWh        # https://www.nrel.gov/docs/fy11osti/48595.pdf, Arithmetic mean of the indicated values
                om_con: 0.021      # $/kWh(fuel)  # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf, Arithmetic mean of the indicated values                
                interest_rate: 0.10 
            co2:
                om_prod: 0.370     # g/kWh         # https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf
                # om_prod: 0.490                    # Lifecycle, https://www.ipcc.ch/site/assets/uploads/2018/02/ipcc_wg3_ar5_annex-iii.pdf             

############################### OCGT - Fossil Fuel 3 ###############################
