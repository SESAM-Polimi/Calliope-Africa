# All the existing connections between countries
# Data found from: SAPP 2021 Report, SAPP 2017 Master Plan and Inframap
# Distances obtained from the QGIS SAPP transmission lines model imported from InfraMap
# When capacities were not available, considered them equal to the values suggested from: https://iea-etsap.org/E-TechDS/PDF/E12_el-t&d_KV_Apr2014_GSOK.pdf

techs:
    Single_Line:
        essentials:
            name: 'High Voltage Averaged Transmission Line'
            parent: transmission
            carrier: electricity
            color: '#C90076'
        constraints:
            lifetime: 40                                     # https://portal.ct.gov/lib/csc/lifecycle-2001.pdf
        costs:
            monetary:
                om_prod: 0.0076                              # https://doi.org/10.5281/zenodo.5242926

#################################################################################################################################
links: 
    MOZ_NC,MOZ_S:
        techs:
            Single_Line:                                        # Evaluated the sum of all the available lines
                constraints:
                    energy_cap_equals: 38000       #kW              # Assumed equal to all capacity sum
                    energy_eff_per_distance: 0.7617  # %/km         # Weighted average of all the lines' total efficiency
                distance: 1                                         # Assume equal to 1 km

