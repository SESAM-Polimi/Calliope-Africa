# Location Constraints for SAPP Model with free Hydro Installation
# For this case, the model is free to install any value between the min and max capacity of the plant
# The plants selected are all the Candidate Plants selected by IRENA: https://globalatlas.irena.org/workspace?type=workspace&layergroup=Layer%2520group%25201
# Selected Candidate Plants with Location Information and Monthly Profiles
# Update every year past model the energy_cap_min_use (0,1)
 
locations:
