
# Technology Definition for New Hydro Plants
# Cost values obtained from NREL 2024 website, the cost were divided into 4 groups for completely new hydro plants:
# 1-10 MW with head 3-30ft, 10MW+ with head 3-30ft, 1-10 MW with head 30ft+, and 10MW+ with head 30ft+
# for large plants (>10 MW) and small plants (1-10 MW) the cost were similar even at different heads
# The average costs were used and obtained two macro-groups: Large:10MW+ & Small<10MW

techs: 
######## New Large Hydro Plants ########  Capacity > 10 MW 
    Hydro_Large_New_1:
        essentials:
            color: '#5AE8EF' 
            name: 'Large Hydro Power Plant (10MW+)'
            parent: supply
            carrier_out: electricity                                  
        constraints:
            energy_eff: 1                           # https://iea-etsap.org/E-TechDS/PDF/E06-hydropower-GS-gct_ADfina_gs.pdf
            resource: inf                  
            lifetime: 50                            # https://www.eia.gov/energyexplained/hydropower/hydropower-and-the-environment.php                                         
        costs:
            monetary: 
                energy_cap: 7697.638                 # https://atb.nrel.gov/electricity/2024/hydropower#85NLUHRY Conservative 2030, NSD2 & NSD4
                om_annual: 42.5                      # https://atb.nrel.gov/electricity/2024/hydropower#85NLUHRY Conservative 2030, NSD2 & NSD4
                interest_rate: 0.10
            co2:
                om_prod: 0
                # om_prod: 0.1265                   # Life-cycle, https://impactful.ninja/the-carbon-footprint-of-hydropower/
    
