                # om_prod: 0.528                   # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf
                om_prod: 0.64                    # Life-cycle https://github.com/calliope-project/uk-calliope               
    
