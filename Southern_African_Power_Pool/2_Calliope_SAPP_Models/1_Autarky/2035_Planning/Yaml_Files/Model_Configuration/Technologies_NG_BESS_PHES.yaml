######## BESS Storage Systems ########
    BESS_New:                                    #Li-ion utility-scale battery storage: 4h
        essentials:
            name: 'Battery Energy Storage'
            parent: storage
            carrier: electricity
        constraints:
            energy_efficiency:  0.85             # https://atb.nrel.gov/electricity/2024/utility-scale_battery_storage
            storage_loss: 0
            lifetime: 15                         # https://atb.nrel.gov/electricity/2024/utility-scale_battery_storage
            storage_discharge_depth: 0.1         # https://atb.nrel.gov/electricity/2024/utility-scale_battery_storage
            storage_initial: 0.2                 
        costs:
            monetary: 
                energy_cap: 1774.915             # https://atb.nrel.gov/electricity/2024/utility-scale_battery_storage Conservative Scenario 2030
                om_annual: 40.309                # https://atb.nrel.gov/electricity/2024/utility-scale_battery_storage Conservative Scenario 2030
                interest_rate: 0.10
    
