
# Technology Definition for New OCGT and New  Energy Storage Systems (BESS & PHES)
# Added Technologies for installed capacity in years 2030 and 2035 to update the model
# Cost values updated for BESS and PHES besd on NREL 2024 website

techs: 
######## New OCGT Power Plants ########
    OCGT_pp_New:
        essentials:
            color: '#B7950B' 
            name: 'Open Cycle Gas Turbine Power Plant New'
            parent: supply                 
            carrier_out: electricity                                
        constraints:
            energy_eff: 0.40                     # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf
            resource: inf                                                    
            lifetime: 30                         # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf                            
            energy_cap_max_systemwide: inf
        costs:
            monetary:   
                energy_cap: 1000                 # https://thundersaidenergy.com/downloads/gas-to-power-project-economics/ 
                om_annual: 40                    # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf, 4% of the CAPEX
                om_prod: 0.0053                  # https://www.nrel.gov/docs/fy11osti/48595.pdf, Arithmetic mean of the indicated values---> 0.0035 2007$ adjusted to 2024$ 
                om_con: 0.021                    # https://africanclimatefoundation.org/wp-content/uploads/2022/10/ACF-GAS-REPORT-2.0-African-Landscape-Final-Web.pdf 2030 Nigerian break-even price
                interest_rate: 0.10
            co2:
                # om_prod: 0.528                   # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf
                om_prod: 0.64                    # Life-cycle https://github.com/calliope-project/uk-calliope               
    
    OCGT_pp_New_2030:
        essentials:
            color: '#B7950B' 
            name: 'Open Cycle Gas Turbine Power Plant New'
