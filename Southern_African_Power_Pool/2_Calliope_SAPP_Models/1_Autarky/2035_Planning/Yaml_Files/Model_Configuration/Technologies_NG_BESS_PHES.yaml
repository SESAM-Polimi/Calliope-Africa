                om_annual: 40                    # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf, 4% of the CAPEX
                om_prod: 0.0053                  # https://www.nrel.gov/docs/fy11osti/48595.pdf, Arithmetic mean of the indicated values---> 0.0035 2007$ adjusted to 2024$ 
                om_con: 0.021                    # https://africanclimatefoundation.org/wp-content/uploads/2022/10/ACF-GAS-REPORT-2.0-African-Landscape-Final-Web.pdf 2030 Nigerian break-even price
                interest_rate: 0.10
