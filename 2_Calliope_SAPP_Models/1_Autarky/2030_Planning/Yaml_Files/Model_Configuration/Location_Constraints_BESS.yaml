# Location Constraints for SAPP Model with free BESS Technologies
# Every five years of modelling add: energy_cap_min equal to previous model value

locations:
################### Power Plants Angola ###########################                                                   
    AGO:
        techs:
            BESS_New:
                constraints:
                    energy_cap_min: 0
                    energy_cap_max: inf
                    energy_cap_per_storage_cap_equals: 0.25

