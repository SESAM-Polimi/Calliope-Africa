
# Set links among border countries to make the model able to add possible interconnections
# Chosse the 400kV lines as is the most used tech in the SAPP 2017 Master PLan
# Considered same technology specifications as used previously
# Calculated the distances from the two closest 400kV(or higher) lines substations on QGIS Model, as a straight line or following similar lines

techs:
    400_kV_New:
        essentials:
            name: 'High Voltage Grid 400 kV'
            parent: transmission
            carrier: electricity
            color: '#000000'
        constraints:
            lifetime: 40                                     # https://portal.ct.gov/lib/csc/lifecycle-2001.pdf
        costs:
            monetary:
                energy_cap: 17.350                           # https://iea-etsap.org/E-TechDS/PDF/E12_el-t&d_KV_Apr2014_GSOK.pdf , Arithmetic average, considering two substations (one at each endpoint).
                energy_cap_per_distance: 40.64               # https://iea-etsap.org/E-TechDS/PDF/E12_el-t&d_KV_Apr2014_GSOK.pdf , Double circuit
                om_prod: 0.0076                              # https://doi.org/10.5281/zenodo.5242926
                interest_rate: 0.10  
###########################################################
######### UNLIMITED FUTURE TRANSMISSION LINKS ############# 
###########################################################

links:
    MOZ_NC,MOZ_S:
        techs:
            400_kV_New: # 400 kV Songo-Vilanculos Substations
                constraints:
                    energy_cap_min: 0
                    energy_cap_max: inf                  
                    energy_eff_per_distance: 0.995              # Assumption based on https://iea-etsap.org/E-TechDS/PDF/E12_el-t&d_kV_new_Apr2014_GSOK.pdf
