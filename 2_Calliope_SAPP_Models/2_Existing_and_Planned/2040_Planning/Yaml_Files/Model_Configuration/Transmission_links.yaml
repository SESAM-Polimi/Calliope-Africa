
# Transmission Grid and the connections Definition #

# Parameters and Units:
    # energy_cap_equals:  Capacity of Grid          [kW]
    # distance:           Distance Between 2 Nodes  [hundreds of km]   

links: 
    MOZ_NC,MOZ_S:
        techs:
            70-110_kV:                                        #110 KV line from Nhamatanda to Mavuzi Substation
                constraints:
                    energy_cap_equals: 38000       #kW              # Assumed this capacity from same V level of other lines from SAPP report
                    energy_eff_per_distance: 0.965   # %/10 km      # Assumption based on https://iea-etsap.org/E-TechDS/PDF/E12_el-t&d_KV_Apr2014_GSOK.pdf
                distance: 7.64                                      # tens of km from QGIS (76.4 km)         