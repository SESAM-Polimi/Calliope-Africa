            lifetime: 30                          # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf                            
            energy_cap_max_systemwide: inf

        costs:
            monetary:   
#               energy_cap: 0
                energy_cap: 1000                   # https://thundersaidenergy.com/downloads/gas-to-power-project-economics/ 
                om_annual: 40                     # https://iea-etsap.org/E-TechDS/PDF/E02-gas_fired_power-GS-AD-gct_FINAL.pdf, 4% of the CAPEX
