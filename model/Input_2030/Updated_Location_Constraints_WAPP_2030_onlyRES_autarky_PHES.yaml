# The West African Power Pool is divided into 14 regions, which are the countries in the Power Pool, named according to
# the ISO 3166-1 Alpha-3 code. Nigeria is divided in 4 regions.

#Update: October 2024

#1. Benin: BEN
#2. Burkina Faso: BFA
#3. Côte d'Ivoire: CIV
#4. The Gambia: GMB
#5. Ghana: GHA
#6. Guinea: GIN
#7. Guinea-Bissau: GNB
#8. Liberia: LBR
#9. Mali: MLI
#10. Niger: NER
#11. Center and North-West Nigeria (Kaduna, Kano, Abuja DISCOs): NGA_CNW
#12. East Nigeria (Yola, Jos DISCOs): NGA_E
#13. South Nigeria (Benin, Enugu, Portharcourt DISCOs): NGA_S
#14. West Nigeria (Ikeja, Ibadan, Eko DISCOs): NGA_W
#15. Senegal: SEN
#16. Sierra Leone: SLE
#17. Togo: TGO

